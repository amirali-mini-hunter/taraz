<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>ورود به AI Pass…</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #0a0e17;
      color: #e6e9ef;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif;
    }
    .wrap {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #6aa9ff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { font-size: 0.95rem; opacity: 0.85; }
    #err { color: #ff6b6b; max-width: 80%; text-align: center; display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="spinner"></div>
    <p>در حال تکمیل ورود… Completing sign-in…</p>
    <p id="err"></p>
  </div>
  <!-- External scripts only: MV3 CSP blocks inline scripts on extension pages -->
  <script src="vendor/aipass-sdk.js"></script>
  <script src="oauth-callback.js"></script>
</body>
</html>
